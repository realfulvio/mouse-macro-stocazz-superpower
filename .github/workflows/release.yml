name: Build native Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-windows.txt -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Build native portable ZIP
        run: python build_native_windows.py
      - name: Check package manifest
        run: python qa/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-v018-candidate
          path: |
            dist/windows/MouseMacroStocazzSuperpower-Windows-v0.18.1-beta.zip
            dist/windows/SHA256SUMS-v0.18.1.txt
          if-no-files-found: error
# A build artifact is a candidate. Interactive acceptance must be repeated on
# its exact ZIP before it replaces an accepted release asset.
