name: Build native Windows candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-windows.txt -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -v
      - name: Build native portable ZIP
        run: python build_native_windows.py
      - name: Check package manifest
        run: python qa/check_package.py
      - name: Install Inno Setup 6 if missing
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }
      - name: Build setup program
        run: python build_windows_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable-candidate
          path: |
            dist/windows/MouseMacroStocazzSuperpower-Windows-*.zip
            dist/windows/MouseMacroStocazzSuperpower-Setup-*.exe
            dist/windows/SHA256SUMS-*.txt
          if-no-files-found: error
# A build artifact is a candidate. Interactive acceptance must be repeated on
# its exact ZIP before it replaces an accepted release asset.
