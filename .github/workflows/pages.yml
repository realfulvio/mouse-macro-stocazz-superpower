# Builds the project website (site/) and publishes it on GitHub Pages.
# Versions and download links are read from the releases API at build time,
# so the site is rebuilt after every published release.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Publish release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/build.py --out _site
      - name: Check page
        run: |
          python - <<'EOF'
          from pathlib import Path
          import re
          root = Path('_site')
          html = (root / 'index.html').read_text(encoding='utf-8').replace('<html lang="it">', '<html>', 1)
          refs = set(re.findall(r'(?:src|href)="(assets/[^"]+)"', html))
          missing = [r for r in refs if not (root / r).is_file()]
          assert not missing, f'missing assets: {missing}'
          it, en = html.count('lang="it"'), html.count('lang="en"')
          assert it == en, f'IT/EN blocks differ: {it} vs {en}'
          size = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'{len(refs)} assets ok, {it} IT/EN pairs, site {size / 1024:.0f} KiB')
          EOF
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
