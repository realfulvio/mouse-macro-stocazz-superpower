# Banco di prova comparativo su runner Windows (VM pulita a ogni esecuzione). Vedi bench/PROCEDURA.md.
name: Bench comparativo Windows
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Ripetizioni per strumento'
        default: '30'
  pull_request:
    paths:
      - 'bench/**'
      - '!bench/ci/profile_idle.py'
      - '!bench/RAPPORTO.md'
      - '!bench/data/**'
      - '.github/workflows/bench.yml'
permissions:
  contents: read
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Logger esterno + clic iniettati
        shell: pwsh
        run: |
          $log = Start-Process python -ArgumentList 'bench/logger/inputlogger.py','--out','smoke.csv','--duration','12' -PassThru -NoNewWindow
          Start-Sleep 1
          python bench/ci/smoke_input.py
          $log.WaitForExit()
          Get-Content smoke.csv | Select-String -Pattern 'ldown|lup|event' | Select -First 20
  bench:
    needs: smoke
    runs-on: windows-latest        # una VM pulita per strumento
    timeout-minutes: 45
    permissions:
      contents: write              # solo per spingere i dati grezzi sul ramo bench-data/*
    strategy:
      fail-fast: false
      matrix:
        tool: [mmss, ahk, tinytask, ideal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Banco di prova (${{ matrix.tool }})
        shell: pwsh
        run: python bench/ci/run_tool.py --tool ${{ matrix.tool }} --runs ${{ github.event.inputs.runs || '30' }} --out results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.tool }}
          path: results/
      - name: Dati grezzi sul ramo bench-data
        if: always() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if (-not (Test-Path results)) { exit 0 }
          git config user.name "bench-bot"; git config user.email "bench-bot@users.noreply.github.com"
          git checkout --orphan data
          git rm -rf --cached . | Out-Null
          git add -f results
          if (-not (git status --porcelain)) { Write-Host "nessun dato da salvare"; exit 0 }
          git commit -m "Bench ${{ matrix.tool }} run ${{ github.run_id }}" | Out-Null
          git push origin "HEAD:refs/heads/bench-data/${{ github.run_id }}-${{ matrix.tool }}"
