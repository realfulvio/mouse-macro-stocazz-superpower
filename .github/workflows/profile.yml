name: Profilo pannello a riposo (Windows)
on:
  workflow_dispatch:
  pull_request:
    paths: ['windows_main.py', 'windows_visual.py', 'macro/**', 'bench/ci/profile_idle.py', '.github/workflows/profile.yml']
concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dipendenze di Windows
        run: pip install -r requirements-windows.txt
      - name: Il fotogramma del percorso rapido e' identico, pixel per pixel, a quello completo
        shell: pwsh
        run: python bench/ci/profile_idle.py --mode verify
      - name: CPU a riposo senza profiler (tre ripetizioni)
        shell: pwsh
        run: |
          foreach ($i in 1..3) { python bench/ci/profile_idle.py --mode cpu --warm 10 --window 20 | Select-String RISULTATO }
      - name: Profilo del thread dell'interfaccia
        shell: pwsh
        run: python bench/ci/profile_idle.py --mode prof --warm 5 --window 25 --top 30
      - name: Schermo a 1920x1080 e macro di riferimento (per registrazione e riproduzione)
        shell: pwsh
        run: |
          python -c "import sys; sys.path[:0]=['bench','bench/ci']; import run_tool, reference_macro, json, pathlib; w,h=run_tool.set_display(); pathlib.Path('results').mkdir(exist_ok=True); spec=json.load(open('bench/macros/reference.spec.json')); pathlib.Path('results/reference.mmr').write_text(json.dumps(reference_macro.to_mmr(spec['events'], w, h, 0, 0))); print(w, h)"
      - name: CPU in registrazione e in riproduzione (tre ripetizioni)
        shell: pwsh
        run: |
          foreach ($i in 1..3) { python bench/ci/profile_idle.py --mode active --warm 8 --window 15 --macro results/reference.mmr | Select-String RISULTATO }
